<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TODO List</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="新しいTODOを入力..." autofocus>
      <input type="email" id="email-input" placeholder="通知先メール (任意)">
      <button type="submit">追加</button>
    </form>
    <ul id="todo-list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
